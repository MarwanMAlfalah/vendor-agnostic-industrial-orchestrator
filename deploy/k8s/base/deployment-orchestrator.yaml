---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: vendor-orchestrator
  labels:
    app.kubernetes.io/name: vendor-orchestrator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: local-kubernetes-reproducibility-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vendor-orchestrator
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vendor-orchestrator
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: orchestrator
          image: vendor-orchestrator:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orchestrator-config
            - secretRef:
                name: langsmith-secret
                optional: true
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: checkpoints
              mountPath: /app/data/langgraph
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: langgraph-checkpoints
